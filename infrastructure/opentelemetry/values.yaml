# Helm values for the OpenTelemetry Collector
# https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-collector

mode: deployment

config:
  receivers:
    otlp:
      protocols:
        grpc:
        http:
  exporters:
    prometheus:
      endpoint: "0.0.0.0:8889"
    otlp/jaeger:
      endpoint: "jaeger-collector:4317"
      tls:
        insecure: true
  service:
    pipelines:
      metrics:
        receivers: [otlp]
        exporters: [prometheus]
      traces:
        receivers: [otlp]
        exporters: [otlp/jaeger]
